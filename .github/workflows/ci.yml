on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

defaults:
  run:
    working-directory: packages/chorus-extension

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/chorus-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.ts"

      - name: Build project
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'packages/chorus-extension/coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found, skipping comment.');
              return;
            }
            const coverage = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const { lines, functions, branches, statements } = coverage.total;
            const threshold = 90;
            const icon = (pct) => pct >= threshold ? 'white_check_mark' : 'warning';

            const body = [
              '## Coverage Report',
              '',
              '| Metric | Coverage | Status |',
              '|--------|----------|--------|',
              `| Lines | ${lines.pct}% | :${icon(lines.pct)}: |`,
              `| Functions | ${functions.pct}% | :${icon(functions.pct)}: |`,
              `| Branches | ${branches.pct}% | :${icon(branches.pct)}: |`,
              `| Statements | ${statements.pct}% | :${icon(statements.pct)}: |`,
              '',
              lines.pct >= threshold && functions.pct >= threshold && branches.pct >= threshold && statements.pct >= threshold
                ? 'All coverage thresholds met (>= 90%).'
                : 'Some coverage thresholds are below 90%.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  package:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: packages/chorus-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package extension
        run: npx vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: chorus-extension-vsix
          path: packages/chorus-extension/*.vsix
          retention-days: 30
